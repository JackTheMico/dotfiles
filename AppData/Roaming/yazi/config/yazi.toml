[opener]
edit = [
  { run = '%EDITOR% "%s"', block = true, for = "windows" },
]

[open]
prepend_rules = [
  { mime = "text/*", use = "edit" },
]

# --- piper.yazi previewers ---

# Markdown
[[plugin.prepend_previewers]]
url = "*.md"
run  = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

# SQLite
[[plugin.prepend_previewers]]
mime = "application/sqlite3"
run  = "piper -- sqlite3 -column -header $1 .dump"

# Directories with eza tree
[[plugin.prepend_previewers]]
mime = "inode/directory"
run  = "piper -- eza --tree --color=always --icons=always $1"

# Binary files with hexyl
[[plugin.prepend_previewers]]
mime = "application/octet-stream"
run  = "piper -- hexyl -n 512 $1"

# Archives with tar (fallback)
[[plugin.prepend_previewers]]
mime = "application/x-*{zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "piper -- tar -tf $1"

# Jupyter notebooks (nbpreview)
[[plugin.prepend_previewers]]
url = "*.ipynb"
run  = "nbpreview"

# Existing ouch for archives (kept as fallback)
[[plugin.prepend_previewers]]
mime = "application/x-*{zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run  = "ouch"
